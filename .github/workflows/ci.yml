name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Placeholders so the build can prerender. Real values live in each deployment.
      NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
      NEXT_PUBLIC_CONVEX_SITE_URL: https://example.convex.site
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The recipe tests run every recipe through a real FFmpeg. Its packages are kept
      # between runs: the runner's Ubuntu mirror is sometimes slow enough that fetching
      # them alone used up the job's 15 minutes.
      - name: Restore the FFmpeg packages
        id: apt-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/apt-archives
          key: apt-ffmpeg-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-v1
          restore-keys: apt-ffmpeg-${{ runner.os }}-${{ env.ImageOS }}-
      - name: Install FFmpeg
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-archives" \
            -o Acquire::Retries=3 \
            ffmpeg fonts-dejavu-core libxml2-utils
          sudo chown -R "$USER" ~/apt-archives
      - name: Keep the FFmpeg packages
        if: steps.apt-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/apt-archives
          key: apt-ffmpeg-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-v1
      # The timeline export tests read every file back with OpenTimelineIO, an independent reader.
      - run: pip install opentimelineio==0.18.1 OpenTimelineIO-Plugins otio-fcpx-xml-adapter
      # The agent's tests build a Memory, which wants a small embedding model (~130MB).
      # It is fetched once here, in one process, and only a good copy is kept for later
      # runs: test files that fetch it at the same time can leave it broken. If the
      # fetch fails the tests still run, since none of them depends on the embeddings.
      - name: Restore the embedding model
        id: fastembed-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/mastra/fastembed-models
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5-hf-v3
      - name: Fetch the embedding model
        id: fastembed-warm
        continue-on-error: true
        working-directory: packages/agent
        run: |
          node --input-type=module -e "
            import { fastembed } from '@mastra/fastembed';
            import { embed } from 'ai';
            const { embedding } = await embed({ model: fastembed, value: 'warm the model' });
            if (!Array.isArray(embedding) || embedding.length !== 384) {
              throw new Error('expected 384 dimensions, got ' + embedding?.length);
            }
          "
      - name: Keep the embedding model
        if: steps.fastembed-warm.outcome == 'success' && steps.fastembed-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/mastra/fastembed-models
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5-hf-v3
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # The review room in a real browser, against a real local backend. The suite (83 tests, about
  # 13 minutes) plus install and the backend start-up ran past a 20-minute cap with every test passing.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The stand-in toolkit runs a real FFmpeg for the steps a test checks the picture of,
      # such as the sheet of frames a look is copied from. The check job keeps the packages.
      - name: Restore the FFmpeg packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/apt-archives
          key: apt-ffmpeg-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-v1
          restore-keys: apt-ffmpeg-${{ runner.os }}-${{ env.ImageOS }}-
      - name: Install FFmpeg
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-archives" \
            -o Acquire::Retries=3 \
            ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-archives" -o Acquire::Retries=3 ffmpeg)
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
