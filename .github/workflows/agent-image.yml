name: Agent image

# Builds the agent server's Docker image (packages/agent/Dockerfile) here instead of on
# the server that runs it, once for Intel/AMD (amd64) and once for ARM such as Apple-chip
# Macs (arm64), each on its own kind of runner. Pull requests only build and start them;
# main also publishes both under one tag and moves the `agent-release` branch, which is
# what the test copy deploys from (packages/agent/Dockerfile.release).
on:
  pull_request:
    paths:
      - packages/agent/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .dockerignore
      - .github/workflows/agent-image.yml
  push:
    branches: [main]
    paths:
      - packages/agent/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .dockerignore
      - .github/workflows/agent-image.yml
  workflow_dispatch:

concurrency:
  group: agent-image-${{ github.ref }}
  # Never cancel a publish half way; a newer push waits its turn.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}-agent
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            # The cache the single-processor build used.
            cache: agent
          - arch: arm64
            runner: ubuntu-24.04-arm
            cache: agent-arm64
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Keeps the pnpm store (a cache mount inside the Dockerfile) between runs, so
      # neither our install nor the one `mastra build` runs downloads every package again.
      - name: Restore the pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: pnpm-store
          key: agent-pnpm-store-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: agent-pnpm-store-${{ matrix.arch }}-
      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3
        with:
          cache-map: |
            { "pnpm-store": { "target": "/pnpm/store", "id": "pnpm-store" } }
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/agent/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ncat-dash-agent:check
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,scope=${{ matrix.cache }},mode=max
      - name: Start it and wait for /health
        run: |
          docker run -d --name agent -p 4111:4111 \
            -e APP_SECRET=ci-app-secret-at-least-32-characters-long \
            -e ANTHROPIC_API_KEY=unused \
            ncat-dash-agent:check
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4111/health; then
              echo
              docker exec agent uname -m
              docker exec agent wget -q -O- http://127.0.0.1:4111/health && echo
              exit 0
            fi
            sleep 2
          done
          docker logs agent
          exit 1
      - name: Image size
        run: docker image inspect ncat-dash-agent:check --format '{{.Size}}' | awk '{ printf "%.0f MB\n", $1 / 1000000 }'
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each machine publishes its half without a tag; the next job joins them.
      - name: Publish this half
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/agent/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.cache }}
      - if: env.PUBLISH == 'true'
        run: |
          mkdir -p digests
          echo "${{ steps.push.outputs.digest }}" > "digests/${{ matrix.arch }}"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agent-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the two halves under one name
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:sha-$GITHUB_SHA" -t "$IMAGE:latest" \
            "$IMAGE@$(cat digests/amd64)" "$IMAGE@$(cat digests/arm64)"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"
      # The test copy's server deploys from this branch (Dockerfile.release), so it
      # only ever picks up a commit whose image is already published.
      - name: Release to the test copy
        if: github.ref == 'refs/heads/main'
        run: git push --force origin HEAD:refs/heads/agent-release
