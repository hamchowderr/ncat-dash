name: Preview backend

# Pushes the backend (the Convex functions) to the preview Convex that Vercel preview
# builds use, so previews never run new frontend code against old functions. It runs
# when a change under convex/ reaches main, and by hand. It never runs on pull
# requests, so a fork never sees the key. The live Convex is not touched.
#
# Needs: repository variable CONVEX_PREVIEW_URL (the preview Convex's address) and
# secret CONVEX_PREVIEW_ADMIN_KEY (from generate_admin_key.sh in its container).
on:
  push:
    branches: [main]
    paths:
      - "convex/**"
      - "scripts/preview-origins.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/convex-preview.yml"
  workflow_dispatch:

concurrency:
  group: convex-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Push the functions to the preview Convex
        env:
          CONVEX_SELF_HOSTED_URL: ${{ vars.CONVEX_PREVIEW_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_PREVIEW_ADMIN_KEY }}
        run: |
          test -n "$CONVEX_SELF_HOSTED_URL" || { echo "Set the CONVEX_PREVIEW_URL variable."; exit 1; }
          test -n "$CONVEX_SELF_HOSTED_ADMIN_KEY" || { echo "Set the CONVEX_PREVIEW_ADMIN_KEY secret."; exit 1; }
          pnpm exec convex deploy -y --typecheck disable
          # Vercel names previews after the project (takewon), so they sign in from these.
          node scripts/preview-origins.mjs "https://takewon-*-otaku-solutions.vercel.app"
