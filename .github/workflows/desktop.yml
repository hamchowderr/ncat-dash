name: Desktop app

# The desktop app (apps/desktop): its tests, the built app driven in a browser test, and
# installable builds for Mac, Windows and Linux. Builds are unsigned until the signing
# certificates exist; each run keeps them as downloads for 14 days.
#
# On main, once the TAURI_SIGNING_PRIVATE_KEY secret is set (the app's update key, see
# docs/desktop-app.md), each run also publishes a release, desktop-v<version>, with the
# installers, the signed update files and latest.json, the feed the app checks for updates.
# The version is tauri.conf.json's major.minor plus this workflow's run number, so each is
# newer than the last. The release stays a draft until every build is in it.

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "src/app/api/desktop/**"
      - ".github/workflows/desktop.yml"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "src/app/api/desktop/**"
      - ".github/workflows/desktop.yml"
      - "pnpm-lock.yaml"

concurrency:
  group: desktop-${{ github.ref }}
  # A release half made would stay a draft, so runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  LINUX_PACKAGES: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install the system libraries and the WebKit driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES webkit2gtk-driver xvfb dbus
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-bin: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      - name: Install tauri-driver
        run: command -v tauri-driver || cargo install tauri-driver --locked --version 2.1.0
      - run: pnpm tauri build --debug --no-bundle
      - run: dbus-run-session -- xvfb-run -a pnpm test:e2e

  # The same browser tests on Windows, through Edge's WebView2 driver. (Apple has no
  # driver for app web views, so the Mac builds are checked by hand.)
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-bin: true
          key: windows-e2e
      - run: pnpm install --frozen-lockfile
      - name: Install tauri-driver and the matching Edge driver
        run: |
          command -v tauri-driver || cargo install tauri-driver --locked --version 2.1.0
          command -v msedgedriver-tool || cargo install --git https://github.com/chippers/msedgedriver-tool --locked
          msedgedriver-tool
          ./msedgedriver.exe --version
          # A small wrapper so the Edge driver writes a full log, shown if the tests fail.
          printf '@"%%~dp0msedgedriver.exe" %%* --verbose --log-path="%%~dp0msedgedriver.log"\r\n' > edgedriver.cmd
          echo "NATIVE_DRIVER=$(pwd -W)/edgedriver.cmd" >> "$GITHUB_ENV"
      - run: pnpm tauri build --debug --no-bundle
      # Starts the app on its own first, so a crash at start shows here and not as a
      # driver that never answers.
      # Starts the app on its own first with its web view open for debugging, the way the
      # Edge driver starts it, so a problem shows here and not as a driver that never answers.
      - name: Check the app starts
        env:
          RUST_BACKTRACE: "1"
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --remote-debugging-port=9222
        run: |
          app=src-tauri/target/debug/ncat-dash-desktop.exe
          "$app" > app.log 2>&1 &
          sleep 20
          tasklist | grep -iE "ncat-dash|msedgewebview2" || true
          answered=0
          curl -s --max-time 5 http://127.0.0.1:9222/json/list && answered=1
          cat app.log
          taskkill //F //T //IM ncat-dash-desktop.exe > /dev/null 2>&1 || true
          taskkill //F //IM msedgewebview2.exe > /dev/null 2>&1 || true
          sleep 3
          if [ "$answered" = 0 ]; then
            echo "The web view did not open for debugging, so the Edge driver could not attach."
            exit 1
          fi
      - run: pnpm test:e2e
      - name: Show the Edge driver log
        if: failure()
        run: tail -n 200 msedgedriver.log || true

  # Decides whether this run publishes, and opens the draft release the builds add to.
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          base=$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')
          version="${base%.*}.${{ github.run_number }}"
          publish=false
          if [ "${{ github.event_name }}" = push ] && [ "$HAS_KEY" = true ]; then publish=true; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$version" >> "$GITHUB_OUTPUT"
          echo "Version $version, publishing: $publish"
      - if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ steps.plan.outputs.tag }}" --draft
          --target "${{ github.sha }}"
          --title "Desktop app ${{ steps.plan.outputs.version }}"
          --notes "The desktop app, built from ${{ github.sha }}. Installed copies update themselves."

  build:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac (Apple chip)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Mac (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # The oldest supported Ubuntu, so the AppImage and .deb run on older Linux too.
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install the system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Build
        if: needs.release.outputs.publish != 'true'
        run: pnpm tauri build --target ${{ matrix.target }}
      # Published builds carry the release's version and sign their update files.
      - name: Build, with signed update files
        if: needs.release.outputs.publish == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: >
          pnpm tauri build --target ${{ matrix.target }}
          --config '{"version":"${{ needs.release.outputs.version }}","bundle":{"createUpdaterArtifacts":true}}'
      - name: Add the files to the release
        if: needs.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          mkdir -p out
          # Both Macs make Takewon.app.tar.gz; the chip goes in its name.
          for file in "$BUNDLE"/macos/*.app.tar.gz "$BUNDLE"/macos/*.app.tar.gz.sig; do
            [ -e "$file" ] || continue
            name=$(basename "$file")
            chip=$(case "${{ matrix.target }}" in aarch64-*) echo aarch64 ;; *) echo x64 ;; esac)
            cp "$file" "out/${name%%.app.tar.gz*}_${{ needs.release.outputs.version }}_${chip}.app.tar.gz${name#*.app.tar.gz}"
          done
          for file in "$BUNDLE"/dmg/*.dmg "$BUNDLE"/msi/*.msi* "$BUNDLE"/nsis/*.exe* \
            "$BUNDLE"/appimage/*.AppImage* "$BUNDLE"/deb/*.deb* "$BUNDLE"/rpm/*.rpm*; do
            [ -e "$file" ] && cp "$file" out/
          done
          ls -l out
          gh release upload "${{ needs.release.outputs.tag }}" out/* --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Desktop app ${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14

  # Writes the update feed from every build's signatures, then makes the release the latest.
  publish:
    needs: [release, build]
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - run: gh release download "$TAG" --pattern '*.sig' --dir feed
      - run: >
          node scripts/desktop-release.mjs feed "${{ needs.release.outputs.version }}"
          "${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG"
      - run: gh release upload "$TAG" feed/latest.json --clobber
      - run: gh release edit "$TAG" --draft=false --latest
