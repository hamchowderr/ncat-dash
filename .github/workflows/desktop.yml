name: Desktop app

# The Kontifi desktop app (apps/desktop): its tests, the built app driven in a browser test,
# and installable builds for Mac, Windows and Linux. Builds are unsigned until the signing
# certificates exist; each run keeps them as downloads for 14 days.

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "src/app/api/desktop/**"
      - ".github/workflows/desktop.yml"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "src/app/api/desktop/**"
      - ".github/workflows/desktop.yml"
      - "pnpm-lock.yaml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LINUX_PACKAGES: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install the system libraries and the WebKit driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES webkit2gtk-driver xvfb dbus
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-bin: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      - name: Install tauri-driver
        run: command -v tauri-driver || cargo install tauri-driver --locked --version 2.1.0
      - run: pnpm tauri build --debug --no-bundle
      - run: dbus-run-session -- xvfb-run -a pnpm test:e2e

  # The same browser tests on Windows, through Edge's WebView2 driver. (Apple has no
  # driver for app web views, so the Mac builds are checked by hand.)
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-bin: true
          key: windows-e2e
      - run: pnpm install --frozen-lockfile
      - name: Install tauri-driver and the matching Edge driver
        run: |
          command -v tauri-driver || cargo install tauri-driver --locked --version 2.1.0
          command -v msedgedriver-tool || cargo install --git https://github.com/chippers/msedgedriver-tool --locked
          msedgedriver-tool
          ./msedgedriver.exe --version
          # A small wrapper so the Edge driver writes a full log, shown if the tests fail.
          printf '@"%%~dp0msedgedriver.exe" %%* --verbose --log-path="%%~dp0msedgedriver.log"\r\n' > edgedriver.cmd
          echo "NATIVE_DRIVER=$(pwd -W)/edgedriver.cmd" >> "$GITHUB_ENV"
      - run: pnpm tauri build --debug --no-bundle
      # Starts the app on its own first, so a crash at start shows here and not as a
      # driver that never answers.
      # Starts the app on its own first with its web view open for debugging, the way the
      # Edge driver starts it, so a problem shows here and not as a driver that never answers.
      - name: Check the app starts
        env:
          RUST_BACKTRACE: "1"
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --remote-debugging-port=9222
        run: |
          app=src-tauri/target/debug/ncat-dash-desktop.exe
          "$app" > app.log 2>&1 &
          sleep 20
          tasklist | grep -iE "ncat-dash|msedgewebview2" || true
          curl -s --max-time 5 http://127.0.0.1:9222/json/list || echo "No web view answered on the debugging port."
          cat app.log
          taskkill //F //T //IM ncat-dash-desktop.exe > /dev/null 2>&1 || true
          taskkill //F //IM msedgewebview2.exe > /dev/null 2>&1 || true
          sleep 3
      - run: pnpm test:e2e
      - name: Show the Edge driver log
        if: failure()
        run: tail -n 200 msedgedriver.log || true

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac (Apple chip)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Mac (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # The oldest supported Ubuntu, so the AppImage and .deb run on older Linux too.
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install the system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: Desktop app ${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14
