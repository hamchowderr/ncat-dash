name: Desktop app

# The Kontifi desktop app (apps/desktop): its tests, the built app driven in a browser test,
# and installable builds for Mac, Windows and Linux. Builds are unsigned until the signing
# certificates exist; each run keeps them as downloads for 14 days.

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "src/app/api/desktop/**"
      - ".github/workflows/desktop.yml"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "src/app/api/desktop/**"
      - ".github/workflows/desktop.yml"
      - "pnpm-lock.yaml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LINUX_PACKAGES: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install the system libraries and the WebKit driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES webkit2gtk-driver xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-bin: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      - name: Install tauri-driver
        run: command -v tauri-driver || cargo install tauri-driver --locked --version 2.1.0
      - run: pnpm tauri build --debug --no-bundle
      - run: xvfb-run -a pnpm test:e2e

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac (Apple chip)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Mac (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # The oldest supported Ubuntu, so the AppImage and .deb run on older Linux too.
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install the system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: Kontifi ${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14
