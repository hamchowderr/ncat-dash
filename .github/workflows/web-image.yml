name: Web image

# Builds the web app's Docker image (Dockerfile) for self-hosted copies, and the setup
# image that pushes the backend (its `setup` stage), once for Intel/AMD (amd64) and once
# for ARM such as Apple-chip Macs (arm64), each on its own kind of runner. On each,
# deploy/test/stack-check.sh starts Convex and the web image from deploy/compose.yml,
# pushes the backend with the setup image and signs up through it. Main also publishes
# both under one tag each: ghcr.io/hamchowderr/takewon-web and takewon-setup,
# :sha-<commit> and :latest.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-image-${{ github.ref }}
  # Never cancel a publish half way; a newer push waits its turn.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}-web
  SETUP: ghcr.io/${{ github.repository }}-setup
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Restore the pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: pnpm-store
          key: web-pnpm-store-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: web-pnpm-store-${{ matrix.arch }}-
      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3
        with:
          cache-map: |
            { "pnpm-store": { "target": "/pnpm/store", "id": "pnpm-store" } }
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: takewon-web:check
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,scope=web-${{ matrix.arch }},mode=max
      - name: Build the setup image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: setup
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: takewon-setup:check
          cache-from: type=gha,scope=web-${{ matrix.arch }}
      - name: Image sizes
        run: |
          for image in takewon-web:check takewon-setup:check; do
            docker image inspect "$image" --format '{{.Size}}' | awk -v i="$image" '{ printf "%s %.0f MB\n", i, $1 / 1000000 }'
          done
      # Only Docker on the machine, as for an owner: the setup image pushes the backend.
      - name: Start the stack and sign up through it
        env:
          WEB_IMAGE: takewon-web:check
          SETUP_IMAGE: takewon-setup:check
        run: deploy/test/stack-check.sh
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each machine publishes its half without a tag; the next job joins them.
      - name: Publish this half
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web-${{ matrix.arch }}
      - name: Publish this half of the setup image
        id: push-setup
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: setup
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.SETUP }},push-by-digest=true,name-canonical=true,push=true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web-${{ matrix.arch }}
      - if: env.PUBLISH == 'true'
        run: |
          mkdir -p digests
          echo "${{ steps.push.outputs.digest }}" > "digests/${{ matrix.arch }}"
          echo "${{ steps.push-setup.outputs.digest }}" > "digests/setup-${{ matrix.arch }}"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-digest-${{ matrix.arch }}
          path: |
            digests/${{ matrix.arch }}
            digests/setup-${{ matrix.arch }}
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: web-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the two halves under one name
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:sha-$GITHUB_SHA" -t "$IMAGE:latest" \
            "$IMAGE@$(cat digests/amd64)" "$IMAGE@$(cat digests/arm64)"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"
          docker buildx imagetools create \
            -t "$SETUP:sha-$GITHUB_SHA" -t "$SETUP:latest" \
            "$SETUP@$(cat digests/setup-amd64)" "$SETUP@$(cat digests/setup-arm64)"
          docker buildx imagetools inspect "$SETUP:sha-$GITHUB_SHA"
