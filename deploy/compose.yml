# Takewon on one machine: the toolkit (with its queue), the Convex backend and its
# admin page, the agent server and the web app.
#
#   cp deploy/.env.example deploy/.env    # fill it in
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d
#   docker compose -f deploy/compose.yml --env-file deploy/.env exec convex ./generate_admin_key.sh
#   # put the key in CONVEX_ADMIN_KEY in deploy/.env, then push the backend:
#   docker compose -f deploy/compose.yml --env-file deploy/.env run --rm setup
#
# Every image is pulled ready-made; nothing is built on the machine. Each is published
# for Intel/AMD and for ARM (Apple-chip Macs), and Docker picks the right one. Pin the
# hamchowderr images to a `sha-<commit>` tag in .env for a machine you rely on.
#
# Each service listens on 127.0.0.1 only. Put a reverse proxy with HTTPS in front
# (Coolify, Caddy, Traefik or nginx) and give each public port its own address:
#   SITE_URL           -> 127.0.0.1:3000  (the dashboard people sign in to)
#   TOOLKIT_URL        -> 127.0.0.1:8080
#   CONVEX_URL         -> 127.0.0.1:3210  (the API)
#   CONVEX_SITE_URL    -> 127.0.0.1:3211  (HTTP actions: webhooks, sign-in, MCP)
#   AGENT_URL          -> 127.0.0.1:4111
#   CONVEX_ADMIN_URL   -> 127.0.0.1:6791  (optional; keep it private)

name: takewon

services:
  toolkit:
    image: ${TOOLKIT_IMAGE:-ghcr.io/hamchowderr/no-code-architects-toolkit:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      API_KEY: ${TOOLKIT_API_KEY:?set TOOLKIT_API_KEY}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?set S3_ENDPOINT_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?set S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION:-auto}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      REDIS_URL: redis://redis:6379/0
      # Leave unset to use half the CPUs the container may use.
      QUEUE_WORKERS: ${QUEUE_WORKERS:-}
    volumes:
      - toolkit-work:/tmp
    depends_on:
      - redis
    # Caps keep the toolkit from starving the rest of the machine. Raise them on a
    # machine that runs nothing else.
    cpus: ${TOOLKIT_CPUS:-4}
    mem_limit: ${TOOLKIT_MEMORY:-8g}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  convex:
    image: ${CONVEX_IMAGE:-ghcr.io/convex/convex-backend:latest}
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:3210:3210"
      - "127.0.0.1:3211:3211"
    environment:
      INSTANCE_NAME: ${CONVEX_INSTANCE_NAME:-takewon}
      INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET:?set CONVEX_INSTANCE_SECRET}
      # The public addresses. Write them out in full: the sign-in setup is built from
      # them when the functions are pushed.
      CONVEX_CLOUD_ORIGIN: ${CONVEX_URL:?set CONVEX_URL}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_URL:?set CONVEX_SITE_URL}
      DISABLE_BEACON: "true"
      REDACT_LOGS_TO_CLIENT: "true"
      # A slow machine can take longer than Convex's 1 second default to load a function.
      DATABASE_UDF_USER_TIMEOUT_SECONDS: ${CONVEX_FUNCTION_TIMEOUT_SECONDS:-5}
      ISOLATE_ANALYZE_USER_TIMEOUT_SECONDS: "30"
    volumes:
      - convex-data:/convex/data
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  convex-admin:
    image: ${CONVEX_DASHBOARD_IMAGE:-ghcr.io/convex/convex-dashboard:latest}
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:6791:6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${CONVEX_URL:?set CONVEX_URL}
    depends_on:
      convex:
        condition: service_healthy

  agent:
    image: ${AGENT_IMAGE:-ghcr.io/hamchowderr/ncat-dash-agent:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4111:4111"
    environment:
      APP_SECRET: ${AGENT_APP_SECRET:?set AGENT_APP_SECRET}
      MASTRA_JWT_SECRET: ${MASTRA_JWT_SECRET:?set MASTRA_JWT_SECRET}
      CONVEX_URL: ${CONVEX_URL:?set CONVEX_URL}
      CONVEX_SITE_URL: ${CONVEX_SITE_URL:?set CONVEX_SITE_URL}
      CHAT_MODEL: ${CHAT_MODEL:-anthropic/claude-sonnet-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      # Chat apps (optional; see docs/self-hosting.md, Chat apps).
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TEAMS_APP_ID: ${TEAMS_APP_ID:-}
      TEAMS_APP_PASSWORD: ${TEAMS_APP_PASSWORD:-}
      TEAMS_APP_TENANT_ID: ${TEAMS_APP_TENANT_ID:-}
      TEAMS_APP_NAME: ${TEAMS_APP_NAME:-}
    volumes:
      - agent-data:/data

  web:
    image: ${WEB_IMAGE:-ghcr.io/hamchowderr/ncat-dash-web:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Written into the pages when the container starts, so changing them only needs a
      # restart, not a new image.
      NEXT_PUBLIC_CONVEX_URL: ${CONVEX_URL:?set CONVEX_URL}
      NEXT_PUBLIC_CONVEX_SITE_URL: ${CONVEX_SITE_URL:?set CONVEX_SITE_URL}
      # The web app talks to the agent server from its own side, over Docker's network.
      MASTRA_SERVER_URL: ${MASTRA_SERVER_URL:-http://agent:4111}
      MASTRA_JWT_SECRET: ${MASTRA_JWT_SECRET:?set MASTRA_JWT_SECRET}

  # Pushes the backend and its settings, then stops. Not started by `up`; run it with
  # `run --rm setup` after the first start and after every update. Keep SETUP_IMAGE on
  # the same commit as WEB_IMAGE, so the dashboard and the backend match.
  setup:
    image: ${SETUP_IMAGE:-ghcr.io/hamchowderr/ncat-dash-setup:latest}
    profiles: [setup]
    environment:
      CONVEX_SELF_HOSTED_URL: http://convex:3210
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${CONVEX_ADMIN_KEY:-}
      SITE_URL: ${SITE_URL:-}
      AGENT_URL: ${AGENT_URL:-}
      MASTRA_JWT_SECRET: ${MASTRA_JWT_SECRET:?set MASTRA_JWT_SECRET}
      SIGN_UPS: ${SIGN_UPS:-}
    depends_on:
      convex:
        condition: service_healthy

  # Another way in instead of a reverse proxy: a Cloudflare Tunnel, so no ports are opened
  # on the router (what the desktop app sets up for a copy on a computer at home). Started
  # with the rest only when COMPOSE_PROFILES=tunnel. Each address goes to its piece by
  # name on Docker's network (web:3000, convex:3210, convex:3211, agent:4111,
  # toolkit:8080); the routes are kept in Cloudflare, so only the token is needed here.
  tunnel:
    image: ${TUNNEL_IMAGE:-cloudflare/cloudflared:latest}
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

volumes:
  toolkit-work:
  redis-data:
  convex-data:
  agent-data:
